name: CI

# PRのopen時とopen以降のpush毎、およびmainへのpushで発火
# （mainでの実行はGradleキャッシュのシードも兼ねる。PRはmainのキャッシュを読む）

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# 同一PRへの連続pushでは古い実行をキャンセルする。mainへのpushはキャンセルしない
# （キャッシュのシードを完走させるため）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # 1プラットフォームの失敗で他を打ち切らず、全プラットフォームの結果を出す
      fail-fast: false
      matrix:
        include:
          # CIは実行時間の均一化のためターゲット別タスクで実行する（CLAUDE.md参照）
          - name: Android
            key: android
            runner: ubuntu-latest
            timeout: 40
            tasks: ":androidApp:assembleDebug :shared:testAndroidHostTest"
          - name: Desktop (JVM)
            key: desktop
            runner: ubuntu-latest
            timeout: 40
            tasks: ":desktopApp:build :shared:jvmTest"
          # webpackタスクはブラウザ不要でjs/wasmJs両ターゲットのコンパイル確認になる
          - name: Web (JS / WasmJs)
            key: web
            runner: ubuntu-latest
            timeout: 40
            tasks: ":webApp:jsBrowserDevelopmentWebpack :webApp:wasmJsBrowserDevelopmentWebpack"
          # シミュレータ上でのDAOテスト実行と、デバイス向けframeworkのコンパイル確認
          # （シミュレータ向けは後続のxcodebuildのPre-actionでembedAndSignが担う）。
          # Kotlin/Nativeのビルドが重いためタイムアウトを長めに取る。
          - name: iOS
            key: ios
            runner: macos-26
            timeout: 60
            tasks: ":shared:iosSimulatorArm64Test :shared:linkDebugFrameworkIosArm64"
    steps:
      - uses: actions/checkout@v7

      # Gradleクライアント起動用のJVM。ビルド本体のdaemon JVMは
      # gradle-daemon-jvm.properties（Corretto 21）がfoojay経由で自動プロビジョニングする
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21

      # Gradle wrapperの検証（validate-wrappers）はv6でデフォルト有効。
      # cache-read-onlyはデフォルト（main=書き込み、それ以外=読み取り専用）に任せる
      - uses: gradle/actions/setup-gradle@v6
        with:
          # 構成キャッシュの永続化に必要（secret未設定でも各実行で構成をやり直すだけで害はない）
          # 生成方法: openssl rand -base64 16
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # Kotlin Gradle PluginがNode.js/Yarnを$GRADLE_USER_HOME配下に自動DLするため
          # キャッシュ対象に追加する（caches/notificationsはデフォルト値の維持）
          gradle-home-cache-includes: |
            caches
            notifications
            nodejs
            yarn

      # Kotlin/Nativeツールチェーン（~/.konan）はsetup-gradleのキャッシュ対象外のため個別にキャッシュ
      - uses: actions/cache@v6
        if: matrix.key == 'ios'
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Build & test
        run: ./gradlew ${{ matrix.tasks }}

      # SPM統合込みでiOSアプリ本体をビルドする（署名なし・シミュレータ向け）。
      # 公式のLocal SPM統合: iosAppスキームのBuild Pre-actionが
      # :shared:embedAndSignAppleFrameworkForXcode を実行してKotlin frameworkを供給し、
      # ローカルSwiftパッケージ（iosApp/SharedKit）がそれをimportする
      - name: Build iOS app (xcodebuild)
        if: matrix.key == 'ios'
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.key }}
          path: '**/build/reports/tests/'
