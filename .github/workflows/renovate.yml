name: Renovate

# Renovate CLIをセルフホスト実行する（運用手順は .github/renovate.md 参照）。
# ロックファイル再生成にpostUpgradeTasks（任意コマンド実行）が必要で、これは
# Mendホスト版の無料枠では使えないため、GitHub Actions上でCLIを直接実行する。
#
# 注意: runs-onは標準SKUのみ使うこと。larger runner（*-large / *-xlarge）は
# PublicリポジトリでもGitHubの課金対象になる。

on:
  schedule:
    # 日・水 21:00 UTC = 月・木 06:00 JST
    - cron: "0 21 * * 0,3"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level"
        type: choice
        options:
          - info
          - debug
        default: info
      dryRun:
        description: "Dry-run（PR作成やpushを行わずログだけ出す）"
        type: boolean
        default: false
  # Renovate設定の変更をmainに取り込んだら即座に動作確認できるようにする
  push:
    branches: [main]
    paths:
      - .github/workflows/renovate.yml
      - .github/renovate.json5
      - renovate-config.js

# Renovateの多重実行はPR操作が競合するため直列化する
concurrency:
  group: renovate
  cancel-in-progress: false

# リポジトリへの書き込みはすべてGitHub App（installation token）側の権限で行う
permissions:
  contents: read

jobs:
  renovate:
    # 標準macOSランナー（Publicリポジトリでは無料）。iOSのSPM依存更新時に
    # postUpgradeTasksでxcodebuildを使うため、LinuxではなくmacOSで実行する。
    # 公式のrenovatebot/github-action（Linux Docker前提）はmacOSで動かないため
    # npxでCLIを直接実行する
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # postUpgradeTasksの./gradlew実行用（ci.ymlと同じ構成）。
      # ビルド本体のdaemon JVMはgradle-daemon-jvm.properties（Corretto 21）が
      # foojay経由で自動プロビジョニングする
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # postUpgradeTasksのGradle実行を高速化するキャッシュ。
      # Renovateはリポジトリを別のtempディレクトリにcloneして作業するが、
      # GRADLE_USER_HOME経由の依存キャッシュはそこでの実行にも効く
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          gradle-home-cache-includes: |
            caches
            notifications
            nodejs
            yarn

      # GitHub Appからinstallation tokenを発行する（有効期限1時間。
      # Renovate本体の実行時間を最大限確保するため、この直後にRenovateを実行する）。
      # GITHUB_TOKENを使わないのは、GITHUB_TOKENで作ったPRには他のワークフロー
      # （ci.yml）が発火せず、automergeが機能しないため
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      # gitAuthorのnoreplyメールアドレスに必要なbotユーザーIDを取得する
      - name: Get app bot user id
        id: app-user
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Run Renovate
        # renovateのバージョンはcustomManager（.github/renovate.json5）が自動更新する
        run: |
          if [ "${{ inputs.dryRun }}" = "true" ]; then
            export RENOVATE_DRY_RUN=full
          fi
          npx --yes renovate@44.4.6
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          # PR・コミットをApp bot名義（<app-slug>[bot]）にする
          RENOVATE_USERNAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          RENOVATE_GIT_AUTHOR: "${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.app-user.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>"
          RENOVATE_CONFIG_FILE: ./renovate-config.js
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
